name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qunxiangxinghuo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/qunxiangxinghuo:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 登录 Docker Hub 拉取最新镜像
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # 停止旧容器
            docker stop qunxiangxinghuo || true
            docker rm qunxiangxinghuo || true
            
            # 拉取新镜像
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/qunxiangxinghuo:latest
            
            # 启动新容器
            docker run -d \
              --name qunxiangxinghuo \
              --restart unless-stopped \
              -p 5000:5000 \
              -e DEPLOY_RUN_PORT=5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/qunxiangxinghuo:latest
            
            # 清理旧镜像
            docker image prune -f
            
            echo "Deployment completed successfully!"
