app = 'qunxiang-xinghuo'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# 鎸佷箙鍖?SQLite 鏁版嵁搴擄紙闇€瑕佸厛鍒涘缓 volume: fly volumes create data -a qunxiang-xinghuo --region sin --size 1锛?[[mounts]]
  source = 'data'
  destination = '/app/backend/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'
