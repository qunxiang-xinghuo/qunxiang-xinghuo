services:
  - type: web
    name: qx-xinghuo
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install
    startCommand: cd frontend && npm install && npx vite --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5173
