services:
  app:
    image: xinghuo:slim
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret-key-here-change-in-production}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${PORT:-3000}}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${PORT:-3000}}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:${PORT:-3000}}
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    container_name: ${CONTAINER_NAME:-xinghuo-app}
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${PORT:-3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret-key-here-change-in-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${PORT:-3000}}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:${PORT:-3000}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - app_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.xinghuo.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.xinghuo.entrypoints=websecure"
      - "traefik.http.routers.xinghuo.tls.certresolver=letsencrypt"
      - "traefik.http.services.xinghuo.loadbalancer.server.port=3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app_data:
